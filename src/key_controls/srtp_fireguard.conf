# Fire-guard thresholds.
#
# Sourced by /sharefs/srtp_clean/key_controls/fire_guard.sh at start-up, so the
# numbers can be retuned without touching the script.
#
# Recalibrate the gas channel like this:
#   1. run   sh fire_guard.sh baseline        (sensor warm, clean air, ~20 s)
#   2. note the reported mean; set CLEAR a little above it and ALARM well above
#   3. restart with  /etc/init.d/S96srtp_fire_guard restart
#
# Bench numbers 2026-10-27 (sensor powered for a day):
#   clean-air baseline   418 .. 431 mV  (mean ~422)
#   lighter gas at 5 cm  peaked at 1536..1544 mV, decayed over ~45 s
#
# Hysteresis: CLEAR and ALARM are different on purpose. The dead band between
# them is what stops the valve chattering while a decaying reading lands on a
# single threshold.

# --- gas channel (MQ-2, ADS1115 AIN2) ---
MQ2_CLEAR_MV=490
MQ2_ALARM_MV=650

# --- flame channel (ADS1115 AIN1) ---
# The IR module on the bench has not shown a usable response to a lighter flame
# yet, so its threshold is parked above the idle level to avoid a permanent
# false alarm. Re-tune once the module is fixed.
FLAME_CLEAR_MV=1000
FLAME_ALARM_MV=1200

# --- temperature (SHT31) ---
# Two independent trip conditions, because a fire shows up in both:
#   absolute  : ambient above TEMP_ALARM_C is a fire
#   rate      : a fast rise is the classic fire signature and catches a fire
#               long before the room is hot
# Keep TEMP_CLEAR_C below TEMP_ALARM_C so the dead band applies here too.
TEMP_ALARM_C=60
TEMP_CLEAR_C=45
TEMP_RISE_C=8
TEMP_RISE_WINDOW_S=30
TEMP_RISE_CLEAR_C=2

# Humidity and pressure are NOT used for the decision - see the header of
# fire_guard.sh for why. They remain display-only values.

# What to do when there is no fresh sample: close (fail-safe) or open (demo).
POLICY_NO_DATA=close
