<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { width: 536px; height: 348px; margin: 0; overflow: hidden; }
  body { padding: 22px 26px 18px; background: #f5f5f1; color: #202421;
         font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .topline { display: flex; justify-content: space-between; align-items: center;
             gap: 16px; color: #626a64; font-size: 15px; line-height: 22px; }
  .topline h1 { margin: 0; color: #202421; font-size: 16px; font-weight: 650; }
  .network { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .network::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: {{WIFI_COLOR}}; }
  .state { margin-top: 18px; }
  .state-label { color: #626a64; font-size: 13px; line-height: 18px; }
  .state-value { margin: 4px 0 0; color: #202421; font-size: 31px; font-weight: 650;
                 line-height: 1.25; letter-spacing: -.5px; }
  .state-value::before { content: ""; display: inline-block; width: 4px; height: 27px;
                         margin-right: 12px; background: #9b622b; vertical-align: -3px; }
  .state-note { margin: 7px 0 0; color: #626a64; font-size: 14px; line-height: 20px; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; margin-top: 18px; }
  .metric { min-width: 0; min-height: 70px; padding-top: 10px; border-top: 1px solid #d7dcd5; }
  .metric-name { display: block; color: #626a64; font-size: 13px; line-height: 18px; }
  .metric-value { display: block; margin-top: 5px; color: #202421; font-size: 27px;
                  font-weight: 600; line-height: 32px; font-variant-numeric: tabular-nums; }
  .metric-value .unit { margin-left: 3px; font-size: 16px; font-weight: 500; }
  .metric-value.unavailable { color: #707871; font-size: 18px; font-weight: 500; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px;
          margin-top: 5px; padding-top: 10px; border-top: 1px solid #d7dcd5;
          color: #626a64; font-size: 13px; line-height: 17px; }
  .foot strong { color: #202421; font-weight: 550; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="topline"><h1>设备状态</h1><span class="network">主板 Wi-Fi {{WIFI}}</span></div>
  <div class="state"><div class="state-label">火情判断</div>
    <p class="state-value">暂未判定</p>
    <p class="state-note">烟雾和气体未接入，当前只显示视觉结果</p>
  </div>
  <div class="metrics">
    <div class="metric"><span class="metric-name">温度 · SHT31</span><span class="metric-value">{{TEMP}}<span class="unit">°C</span></span></div>
    <div class="metric"><span class="metric-name">相对湿度 · SHT31</span><span class="metric-value">{{HUMIDITY}}<span class="unit">%</span></span></div>
    <div class="metric"><span class="metric-name">烟雾</span><span class="metric-value unavailable">未接入</span></div>
    <div class="metric"><span class="metric-name">可燃气体 / CO</span><span class="metric-value unavailable">预留</span></div>
  </div>
  <div class="foot"><span>气压 <strong>{{PRESSURE}} hPa</strong> · BMP280</span><span>板端状态</span></div>
</body>
</html>
