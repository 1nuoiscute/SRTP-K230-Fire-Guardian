name: PC source and rule checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B tools/check_public_repo.py
      - run: python -B tools/check_key1_draw_path.py --self-test
      - run: python -B -m unittest discover -s model_work/src -p 'test_*.py' -v
